# Speech framework defaults. To override locally without touching this file,
# create config.local.yaml next to it (gitignored) with just the keys you change.

robot:
  name: yotie
  network_interface: eno0
  asr_topic: rt/audio_msg
  volume: 100
  # After the robot speaks, how long it stays deaf (so it doesn't hear itself):
  playback_grace_s: 0.5       # max wait past the audio's length for play_state 0
  echo_tail_s: 0.3            # extra pause for the room echo to die
  stream_chunk_s: 1.0         # PlayStream chunk size while streaming a reply
  stream_lead_s: 1.5          # never send audio more than this far ahead of real time

stt:
  source: g1-mic              # g1-mic | pc-mic | g1-asr  (override with --stt)
  fallback_after_s: 5         # g1-mic: switch to g1-asr if no robot audio arrives by then (0 = never)
  engine: faster-whisper
  whisper:
    model: small              # tiny | base | small | distil-large-v3 (en only) | large-v3-turbo
    device: auto              # auto | cuda | cpu
    compute_type: default     # default | float16 | int8_float16 | int8
    language: null            # null = auto-detect; or en / zh / ja / es to force one
    beam_size: 1
  vad:                        # Silero VAD end-of-turn detection (g1-mic / pc-mic)
    threshold: 0.5
    min_silence_ms: 300       # silence that ends a turn (onboard ASR: ~1-2 s, fixed). Was 500.
    preroll_ms: 300
    max_utterance_s: 20
  g1_mic:                     # robot mic multicast (Unitree G1 audio docs)
    local_ip: 192.168.123.222 # this PC's address on eno0
    group: 239.168.123.161
    port: 5555
  pc_mic:
    device: null              # null = default input; or a sounddevice name / index
  g1_asr:
    debounce_s: 0.8           # accept a partial if is_final hasn't arrived by then

llm:
  provider: gemini            # gemini | deepseek | claude
  providers:
    gemini:
      model: gemini-3.8-flash
      max_tokens: 4096        # Gemini counts thinking tokens against this budget
      thinking_level: low     # lowest gemini-3.8-flash accepts (minimal is rejected, checked Oct 7)
    deepseek:
      model: deepseek-chat
      max_tokens: 256
      base_url: https://api.deepseek.com
    claude:
      model: claude-sonnet-5-5
      max_tokens: 4096

conversation:
  persona: ../utilities/persona-defs/sb01_default.txt
  # In-session context only (no persistent memory). 0 = every turn stands alone.
  max_history_turns: 6
  default_language: en
  greeting: "Hi! I'm sb01. What's up?"
  stream: true                # speak sentence by sentence while the LLM writes (--no-stream: off)
  first_clause_words: 6       # flush the first clause early at a comma after this many words
  tone_guide: ../utilities/persona-defs/tone_guide.txt   # added to the prompt for voices with tone_tags
  timing_log: logs/turns.jsonl  # per-turn latency, timings only (null = off)

tts:
  device: auto                # auto | cuda | cpu | mps
  preload: true               # load models at startup instead of on first use
  multilingual_t3_model: v3
  voice: chatterbox           # which voice below (or a voice-refs folder) to speak with; --voice NAME

  # Voice registry (see voices.py). Each voice routes languages to an engine:
  #   nano          Chatterbox Nano: English only, fast, [laugh]-style tags
  #   multilingual  Chatterbox Multilingual v3: zh / ja / es / en ..., maps <tone> to exaggeration
  #   utau          UTAU voicebank (bank: folder with oto.ini), full <tone> pitch/speed control
  # voice: null = the model's built-in voice, or a reference clip to clone;
  # voice_from_bank: <bank folder> clones a UTAU singer with Chatterbox instead (teto-ai).
  # Any extra keys are passed straight to the engine (e.g. exaggeration, base_pitch).
  # Languages a voice lacks go to its fallback voice.
  voices:
    chatterbox:
      description: Chatterbox built-in voice
      languages:
        en: { engine: multilingual, voice: null }
        zh: { engine: multilingual, voice: null, exaggeration: 0.5, cfg_weight: 0.5 }
        ja: { engine: multilingual, voice: null, exaggeration: 0.5, cfg_weight: 0.5 }
        es: { engine: multilingual, voice: null, exaggeration: 0.5, cfg_weight: 0.5 }
    chatterbox-nano:
      description: Chatterbox built-in voice, Nano for English (faster)
      fallback: chatterbox
      languages:
        en: { engine: nano, voice: null }
    teto:
      description: Kasane Teto UTAU voicebanks (English CVVC + Japanese CV)
      fallback: chatterbox      # zh / es
      tone_tags: true
      # Banks are installed outside git (redistribution is not allowed): see
      # utilities/voice-refs/README.md. Put your own paths in config.local.yaml if they differ.
      languages:
        en: { engine: utau, bank: "~/voicebanks/teto/english/重音テト音声ライブラリー/重音テト英語音源", base_pitch: -2 }
        ja: { engine: utau, bank: "~/voicebanks/teto/japanese-cv/重音テト音声ライブラリー/重音テト単独音", base_pitch: -2 }
    teto-ai:
      description: Teto's timbre on Chatterbox (cloned from the installed banks), natural intonation
      fallback: chatterbox      # zh / es: cloning from Teto's sung samples drags and garbles them
      # voice_from_bank builds a ~15 s clip of the bank's own samples (in ~/.cache, never in git)
      languages:
        en: { engine: nano, voice_from_bank: "~/voicebanks/teto/english/重音テト音声ライブラリー/重音テト英語音源" }
        ja: { engine: multilingual, voice_from_bank: "~/voicebanks/teto/japanese-cv/重音テト音声ライブラリー/重音テト単独音", exaggeration: 0.5, cfg_weight: 0.5 }

  # Every folder in voice_dirs is a voice too, named after the folder: drop a clean
  # ~10 s clip (wav / mp3 / flac) in utilities/voice-refs/<name>/ and use --voice <name>.
  # An optional voice.yaml there sets consent, engine, per-language clips (see voices.py).
  voice_dirs: [../utilities/voice-refs]
  clone_fallback: chatterbox
  clone_defaults:             # how a folder clip is used, per language
    en: { engine: multilingual }
    zh: { engine: multilingual, exaggeration: 0.5, cfg_weight: 0.5 }
    ja: { engine: multilingual, exaggeration: 0.5, cfg_weight: 0.5 }
    es: { engine: multilingual, exaggeration: 0.5, cfg_weight: 0.5 }

  utau:
    sample_rate: 24000        # render rate (same as Chatterbox)
    cache_dir: ~/.cache/sb01-utau   # WORLD analysis of the bank samples (derived data, outside git)
    warmup: true              # analyse the whole bank in the background at startup (one-off)
