# Speech framework defaults. To override locally without touching this file,
# create config.local.yaml next to it (gitignored) with just the keys you change.

robot:
  name: sb01
  network_interface: eno0
  asr_topic: rt/audio_msg
  volume: 100

llm:
  provider: gemini            # gemini | deepseek | claude
  providers:
    gemini:
      model: gemini-3.8-flash
      max_tokens: 1024        # Gemini counts thinking tokens against this budget
      thinking_level: low
    deepseek:
      model: deepseek-chat
      max_tokens: 256
      base_url: https://api.deepseek.com
    claude:
      model: claude-sonnet-5-5
      max_tokens: 256

conversation:
  persona: ../utilities/persona-defs/sb01_default.txt
  # In-session context only (no persistent memory). 0 = every turn stands alone.
  max_history_turns: 6
  default_language: en
  greeting: "Hi! I'm sb01. What's up?"

tts:
  device: auto                # auto | cuda | cpu | mps
  preload: true               # load models at startup instead of on first use
  multilingual_t3_model: v3
  # Per-language engine + voice. voice: null = model's built-in voice;
  # otherwise a path to a reference clip (see utilities/voice-refs/README.md).
  # Any extra keys are passed straight to the model's generate().
  languages:
    en: { engine: nano,         voice: null }
    zh: { engine: multilingual, voice: null, exaggeration: 0.5, cfg_weight: 0.5 }
    ja: { engine: multilingual, voice: null, exaggeration: 0.5, cfg_weight: 0.5 }
    es: { engine: multilingual, voice: null, exaggeration: 0.5, cfg_weight: 0.5 }
